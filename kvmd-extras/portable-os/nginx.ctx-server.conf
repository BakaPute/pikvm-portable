location ^~ /extras/portable-os/api/ {
    auth_request /auth_check;
    proxy_pass http://pikvm_portable_api;
    include /etc/kvmd/nginx/loc-proxy.conf;
    include /etc/kvmd/nginx/loc-nocache.conf;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Share-Origin $scheme://$http_host;
    proxy_set_header X-Pikvm-Share $http_x_pikvm_share;
    proxy_intercept_errors off;
    client_max_body_size 8k;
    proxy_read_timeout 75s;
}
location ^~ /extras/portable-os/ {
    auth_request /auth_check;
    root /usr/share/kvmd/web;
    include /etc/kvmd/nginx/loc-login.conf;
    include /etc/kvmd/nginx/loc-nocache.conf;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
}

# Normal entry into former tools stays in the unified shell. Native KVM and
# ttyd remain unchanged; append ?legacy=1 to use the original tools directly.
location = /extras/pikvm-share/ {
    set $portable_destination "/extras/portable-os/#share";
    include /usr/share/kvmd/extras/portable-os/nginx.legacy.conf;
}
location = /extras/pikvm-share/index.html {
    set $portable_destination "/extras/portable-os/#share";
    include /usr/share/kvmd/extras/portable-os/nginx.legacy.conf;
}
location = /extras/image-manager/ {
    set $portable_destination "/extras/portable-os/#images";
    include /usr/share/kvmd/extras/portable-os/nginx.legacy.conf;
}
location = /extras/image-manager/index.html {
    set $portable_destination "/extras/portable-os/#images";
    include /usr/share/kvmd/extras/portable-os/nginx.legacy.conf;
}
location = /extras/wifi-wizard/ {
    set $portable_destination "/extras/portable-os/#network";
    include /usr/share/kvmd/extras/portable-os/nginx.legacy.conf;
}
location = /extras/wifi-wizard/index.html {
    set $portable_destination "/extras/portable-os/#network";
    include /usr/share/kvmd/extras/portable-os/nginx.legacy.conf;
}
