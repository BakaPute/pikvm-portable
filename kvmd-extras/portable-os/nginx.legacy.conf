# Included only by exact legacy entry locations. APIs/assets are untouched.
# legacy=1 is the explicit fallback, available throughout the migration.
if ($arg_legacy != "1") { return 302 $portable_destination; }
auth_request /auth_check;
root /usr/share/kvmd/web;
include /etc/kvmd/nginx/loc-login.conf;
include /etc/kvmd/nginx/loc-nocache.conf;
