location ^~ /extras/pikvm-share/api/ {
    auth_request /auth_check;
    proxy_pass http://pikvm_share_api;
    include /etc/kvmd/nginx/loc-proxy.conf;
    include /etc/kvmd/nginx/loc-nocache.conf;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Share-Origin $scheme://$http_host;
    proxy_set_header X-Pikvm-Share $http_x_pikvm_share;
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 1m;
    client_body_timeout 30s;
    proxy_read_timeout 180s;
    proxy_send_timeout 30s;
}

location ^~ /extras/pikvm-share/ {
    auth_request /auth_check;
    root /usr/share/kvmd/web;
    include /etc/kvmd/nginx/loc-login.conf;
    include /etc/kvmd/nginx/loc-nocache.conf;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
}
