name: PIKVM-SHARE checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  share:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile scripts/pikvm-share-api scripts/pikvm-share-install scripts/pikvm-share-remount
      - run: bash -n install.sh && bash -n install-share.sh && bash -n scripts/pikvm-share-diagnose.sh
      - run: node --check web/extras/pikvm-share/app.js
