# Explicit, reviewed include in HTTP context only. Never auto-installed.
# Use a separate hostname/browser profile from the native administrator origin.
limit_req_zone $binary_remote_addr zone=portable_security_rate:128k rate=10r/s;
limit_conn_zone $binary_remote_addr zone=portable_security_connections:128k;
server {
    listen 8443 ssl;
    server_name share.pikvm.home.arpa;
    if ($host != share.pikvm.home.arpa) { return 421; }
    include /etc/kvmd/nginx/ssl.conf;
    auth_request off;
    limit_conn portable_security_connections 8;
    client_max_body_size 8g;
    location / {
        limit_req zone=portable_security_rate burst=20 nodelay;
        proxy_pass http://127.0.0.1:9879;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Portable-Delegation "";
        proxy_set_header X-KVMD-User "";
        proxy_set_header X-KVMD-Passwd "";
        proxy_set_header Authorization "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
    }
}
